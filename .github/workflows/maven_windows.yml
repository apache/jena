name: Apache Jena CI (MS Windows)
on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build with Maven
      run: mvn -B --file pom.xml -Dmaven.javadoc.skip=true install